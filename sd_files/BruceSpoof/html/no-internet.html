<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>No internet</title>
<style>
  html,body{margin:0;height:100%;background:#140a1e;color:#f2e9ff;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  .wrap{max-width:34rem;margin:0 auto;padding:3rem 1.5rem;text-align:center}
  .crown{font-size:3.5rem;line-height:1;background:linear-gradient(90deg,#ff1493,#8000ff);
    -webkit-background-clip:text;background-clip:text;color:transparent}
  h1{font-size:1.4rem;margin:1.2rem 0 .6rem}
  p{opacity:.8;line-height:1.5;margin:.4rem 0}
  .hint{margin-top:2rem;font-size:.8rem;opacity:.5}
</style>
</head>
<body>
<div class="wrap">
  <div class="crown">&#9819;</div>
  <h1>No internet connection</h1>
  <p>This network is not reachable right now.</p>
  <p>Check your connection and try again.</p>
  <p class="hint">Vandeta</p>
</div>
</body>
</html>
